apply plugin: 'c'

model {
	components {
		driverIntcBcm2835(NativeLibrarySpec) {
	    	targetPlatform "tinkerArm4Soft"
	    	targetPlatform "tinkerArm7HardVfp"
                targetPlatform "tinkerArm8aHardVfp"
                binaries.withType(SharedLibraryBinarySpec) {
                    buildable = false
                }
