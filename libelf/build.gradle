apply plugin: 'c'

model {
    components {
        libelf(NativeLibrarySpec) {
            targetPlatform "tinkerArm4Soft"
            targetPlatform "tinkerArm7HardVfp"
            targetPlatform "tinkerLocal"
            binaries.withType(SharedLibraryBinarySpec) {
                buildable = false
            }
            binaries {
                all {
                    cCompiler.args "-Wno-error",
                    "-Wno-pedantic",
                    "-Wno-type-limits",
                    "-Wno-sign-compare",
                    "-Wno-int-conversion",
                    "-Wno-unused-variable",
                    "-Wno-incompatible-pointer-types"
                }
            }
        }
    }
}
