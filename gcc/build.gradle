task weaveApiAarch64 (type:Exec, dependsOn: [
    ':api:apiTinkerArm8aHardVfpDebugStaticLibrary', 
    ':archArm:archArmTinkerArm8aHardVfpDebugStaticLibrary']) {
    workingDir getProjectDir().getAbsolutePath()
    commandLine 'bash',
        '-c',
        'mkdir -p tmp;\
        cd tmp;\
        cp ../../aarch64-elf/aarch64-elf/lib/libc.a ../../aarch64-elf/aarch64-elf/lib/libc.a.old;\
        aarch64-elf-ar x ../../aarch64-elf/aarch64-elf/lib/libc.a;\
        aarch64-elf-ar x ../../api/build/libs/api/static/tinkerArm4Soft/debug/*;\
        aarch64-elf-ar x ../../archArm/build/libs/archArm/static/tinkerArm4Soft/debug/*;\
        aarch64-elf-ar q ../../aarch64-elf/aarch64-elf/lib/libc.a *.o*;\
        rm -rf tmp;\
        cp ../../api/src/api/headers/*.h ../../aarch64-elf/aarch64-elf/include/;\
        cp ../../base/src/base/headers/*.h ../../aarch64-elf/aarch64-elf/include/;\
        cp ../../archArm/src/archArm/headers/tgt_mem.h ../../aarch64-elf/aarch64-elf/include/;\
        cp ../../archArm/src/archArm/headers/arm5/tgt_io.h ../../aarch64-elf/aarch64-elf/include/;'
}

/* -------------------------------- clean --------------------------- */

task cleanGcc(type:Exec) {
	commandLine 'bash',
		'-c',
		'rm -rf build-arm-eabi-stage1;\
		 rm -rf build-arm-eabi-stage3;\
		 rm -rf src;\
		 rm -rf *.tar.xz'
}

cleanGcc.outputs.upToDateWhen {false}
clean.finalizedBy(cleanGcc)

class Downloader extends DefaultTask {
    @Input
    String sourceUrl

    @OutputFile
    File target

    @TaskAction
    void download() {
        ant.get(src: sourceUrl, dest: target)
    }
}

class BuildSetup extends DefaultTask {
    @Input
    String root
    @Input
    String target

    @TaskAction
    void setup() {
        java.io.File path = new File(root + "//build-" + target)
        path.mkdirs();
    }
}
